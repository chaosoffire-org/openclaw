name: Build signed Android APK

on:
  push:
    branches: [app]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: ./.github/actions/setup-node-env
        with:
          cache-mode: off
          install-bun: "true"

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -name sdkmanager -type f | sort | tail -1)"
          yes | "${SDKMANAGER}" --licenses >/dev/null || true
          "${SDKMANAGER}" --install "platforms;android-37.0" "build-tools;37.0.0"

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${KEYSTORE_BASE64}"
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/keystore.jks"
          test -s "${RUNNER_TEMP}/keystore.jks"

      - name: Configure signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "${KEYSTORE_PASSWORD}"
          test -n "${KEY_ALIAS}"
          {
            echo "ORG_GRADLE_PROJECT_OPENCLAW_ANDROID_STORE_FILE=${RUNNER_TEMP}/keystore.jks"
            echo "ORG_GRADLE_PROJECT_OPENCLAW_ANDROID_STORE_PASSWORD=${KEYSTORE_PASSWORD}"
            echo "ORG_GRADLE_PROJECT_OPENCLAW_ANDROID_KEY_ALIAS=${KEY_ALIAS}"
            echo "ORG_GRADLE_PROJECT_OPENCLAW_ANDROID_KEY_PASSWORD=${KEYSTORE_PASSWORD}"
          } >> "${GITHUB_ENV}"

      - name: Build signed release APK
        run: bun apps/android/scripts/build-release-artifacts.ts --artifact play

      - name: Verify lightweight APK permissions
        run: |
          set -euo pipefail
          APK="$(find apps/android/build/release-artifacts -name '*.apk' -print -quit)"
          test -n "${APK}"
          BUILD_TOOLS="$(find "${ANDROID_HOME}/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          "${BUILD_TOOLS}/aapt2" dump permissions "${APK}" | tee "${RUNNER_TEMP}/apk-permissions.txt"
          if grep -E 'SEND_SMS|READ_SMS|READ_CALL_LOG|READ_CONTACTS|WRITE_CONTACTS|READ_CALENDAR|WRITE_CALENDAR|ACCESS_FINE_LOCATION|ACCESS_COARSE_LOCATION|ACCESS_BACKGROUND_LOCATION|CAMERA|RECORD_AUDIO|ACTIVITY_RECOGNITION' "${RUNNER_TEMP}/apk-permissions.txt"; then
            echo "Unexpected sensitive permission in lightweight APK" >&2
            exit 1
          fi
          "${BUILD_TOOLS}/aapt2" dump xmltree "${APK}" --file AndroidManifest.xml > "${RUNNER_TEMP}/manifest.xml"
          if grep -E 'BIND_NOTIFICATION_LISTENER_SERVICE|BIND_ACCESSIBILITY_SERVICE|READ_SMS|RECEIVE_SMS' "${RUNNER_TEMP}/manifest.xml"; then
            echo "Unexpected sensitive service/permission in lightweight APK" >&2
            exit 1
          fi

      - name: Read tracked stable tag
        id: stable
        run: echo "tag=$(cat .upstream-stable-tag)" >> "${GITHUB_OUTPUT}"

      - name: Publish stable APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.stable.outputs.tag }}
          name: Android ${{ steps.stable.outputs.tag }}
          files: apps/android/build/release-artifacts/*.apk
          fail_on_unmatched_files: true
          make_latest: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
