name: Build signed Android APK

on:
  push:
    branches: [app]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-37" "build-tools;37.0.0"

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${KEYSTORE_BASE64}"
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > apps/android/keystore.jks
          test -s apps/android/keystore.jks

      - name: Configure signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "${KEYSTORE_PASSWORD}"
          test -n "${KEY_ALIAS}"
          mkdir -p apps/android/build/release-signing
          cat > apps/android/build/release-signing/gradle.properties <<PROPS
          OPENCLAW_ANDROID_STORE_FILE=${GITHUB_WORKSPACE}/apps/android/keystore.jks
          OPENCLAW_ANDROID_STORE_PASSWORD=${KEYSTORE_PASSWORD}
          OPENCLAW_ANDROID_KEY_ALIAS=${KEY_ALIAS}
          OPENCLAW_ANDROID_KEY_PASSWORD=${KEYSTORE_PASSWORD}
          PROPS
          while IFS='=' read -r name value; do
            [ -n "${name}" ] || continue
            echo "ORG_GRADLE_PROJECT_${name}=${value}" >> "${GITHUB_ENV}"
          done < apps/android/build/release-signing/gradle.properties

      - name: Build signed release APK
        run: bun apps/android/scripts/build-release-artifacts.ts --artifact third-party

      - uses: actions/upload-artifact@v4
        with:
          name: openclaw-android-apk
          path: |
            apps/android/build/release-artifacts/*.apk
            apps/android/build/release-artifacts/*.sha256
