name: Build signed Android APK

on:
  push:
    branches: [app]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: ./.github/actions/setup-node-env
        with:
          cache-mode: off
          install-bun: "true"

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -name sdkmanager -type f | sort | tail -1)"
          yes | "${SDKMANAGER}" --licenses >/dev/null || true
          "${SDKMANAGER}" --install "platforms;android-37.0" "build-tools;37.0.0"

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${KEYSTORE_BASE64}"
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/keystore.jks"
          test -s "${RUNNER_TEMP}/keystore.jks"

      - name: Configure signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "${KEYSTORE_PASSWORD}"
          test -n "${KEY_ALIAS}"
          {
            echo "ORG_GRADLE_PROJECT_OPENCLAW_ANDROID_STORE_FILE=${RUNNER_TEMP}/keystore.jks"
            echo "ORG_GRADLE_PROJECT_OPENCLAW_ANDROID_STORE_PASSWORD=${KEYSTORE_PASSWORD}"
            echo "ORG_GRADLE_PROJECT_OPENCLAW_ANDROID_KEY_ALIAS=${KEY_ALIAS}"
            echo "ORG_GRADLE_PROJECT_OPENCLAW_ANDROID_KEY_PASSWORD=${KEYSTORE_PASSWORD}"
          } >> "${GITHUB_ENV}"

      - name: Build signed release APK
        run: bun apps/android/scripts/build-release-artifacts.ts --artifact third-party

      - uses: actions/upload-artifact@v4
        with:
          name: openclaw-android-apk
          path: |
            apps/android/build/release-artifacts/*.apk
            apps/android/build/release-artifacts/*.sha256
